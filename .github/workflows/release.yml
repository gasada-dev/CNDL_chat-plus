name: Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify release tag
        id: version
        shell: bash
        run: |
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test -n "$mod_version"
          test "$GITHUB_REF_NAME" = "v$mod_version"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"

      - name: Test and build release
        run: ./gradlew clean test build

      - name: Verify release JARs
        shell: bash
        run: |
          test -f "build/release/CNDL_chat+-${{ steps.version.outputs.mod_version }}-mc1.21.11.jar"
          test -f "build/release/CNDL_chat+-${{ steps.version.outputs.mod_version }}-mc26.2.jar"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/release/CNDL_chat+-${{ steps.version.outputs.mod_version }}-mc1.21.11.jar" \
            "build/release/CNDL_chat+-${{ steps.version.outputs.mod_version }}-mc26.2.jar" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "CNDL_chat+ ${{ steps.version.outputs.mod_version }}"
